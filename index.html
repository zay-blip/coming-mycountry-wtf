<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My America holdings</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0B0F14; color: #F4F6F8; font-family: Calibri, "Segoe UI", sans-serif; }
  button { cursor: pointer; font: inherit; }
  header { padding: 1rem 1rem 0; max-width: 72rem; margin: 0 auto; }
  header img { width: min(92vw, 640px); display: block; }
  h1 { margin: .3rem 0 .2rem; font-size: 1.7rem; }
  .muted { color: #8893A2; }
  .banner { margin: .8rem 0; padding: .7rem .8rem; border-radius: 8px; background: #2a1212; border: 1px solid #EF4444; }
  .filters { display: flex; flex-wrap: wrap; gap: .4rem; margin: .8rem 0; }
  .filters button, .layers button { border: 1px solid #232A34; background: #11161D; color: #F4F6F8; border-radius: 6px; padding: .4rem .7rem; }
  .filters button.on, .layers button.on { background: #F5D76E; color: #1A1400; border-color: #F5D76E; }
  main { max-width: 72rem; margin: 0 auto; padding: 0 1rem 2rem; display: grid; gap: 1rem; }
  @media (min-width: 900px) { main { grid-template-columns: 1.1fr .9fr; align-items: start; } }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .35rem; }
  li { background: #11161D; border-radius: 8px; padding: .55rem .7rem; border: 1px solid #232A34; }
  li.owned { border-color: #22C55E; }
  li.open { border-color: #F5D76E; }
  li.taken { border-color: #EF4444; }
  li b { display: block; }
  .tag { font-size: .75rem; letter-spacing: .04em; }
  .owned .tag { color: #22C55E; }
  .open .tag { color: #F5D76E; }
  .taken .tag { color: #EF4444; }
  img.map { width: 100%; border-radius: 8px; border: 1px solid #232A34; background: #0B0F14; }
  input { width: 100%; margin: .4rem 0 .6rem; padding: .55rem .7rem; border-radius: 8px; border: 1px solid #232A34; background: #11161D; color: #F4F6F8; }
  .cap { font-family: Consolas, ui-monospace, monospace; font-size: .72rem; color: #8893A2; }
</style>
</head>
<body>
<header>
  <img src="maps/logo-myamerica-crop.png" alt="MyAmerica.WTF" />
  <h1>My America domain holdings</h1>
  <p class="muted">Public project map only. Green is on our list. Gold is still open. Red means the registry shows that open name is now registered.</p>
  <p class="cap" id="checked">Registration check has not run yet.</p>
  <div id="alert"></div>
  <div class="layers" id="layers"></div>
  <div class="filters" id="filters"></div>
</header>
<main>
  <section>
    <input id="q" type="search" placeholder="Find a name" />
    <ul id="list"></ul>
  </section>
  <section>
    <img id="map" class="map" alt="Holdings map" src="maps/map_06_full.png" />
    <p class="cap" id="mapcap">Owned states and capitals, zones still open.</p>
  </section>
</main>
<script>
const MAPS = {
  all: ["maps/map_06_full.png", "Owned states and capitals, zones still open."],
  peak: ["maps/map_01_peak.png", "myamerica.wtf"],
  zones: ["maps/map_02_zones.png", "Five zone names. Still open."],
  states: ["maps/map_03_states.png", "Fifty state names on the list."],
  capitals: ["maps/map_04_capitals.png", "Capital names. One still open."]
};
let holdings = null;
let status = { domains: {} };
let layer = "all";
let filter = "all";

function liveState(domain, role) {
  if (role === "owned") return "owned";
  const hit = (status.domains || {})[domain];
  if (hit && hit.state === "registered") return "taken";
  return "open";
}
function label(state) {
  if (state === "owned") return "On our list";
  if (state === "taken") return "Registered by someone else";
  return "Still open";
}
function rows() {
  const out = [];
  out.push({ layer: "peak", name: "My America", domain: holdings.peak.domain, state: liveState(holdings.peak.domain, holdings.peak.role) });
  for (const z of holdings.zones) {
    out.push({ layer: "zones", name: z.label + " · " + z.states, domain: z.domain, state: liveState(z.domain, z.role) });
  }
  for (const s of holdings.states) {
    out.push({ layer: "states", name: s.name, domain: s.domain, state: liveState(s.domain, s.role) });
    if (s.capitalDomain) {
      out.push({ layer: "capitals", name: s.name + " capital", domain: s.capitalDomain, state: liveState(s.capitalDomain, s.capitalRole) });
    }
  }
  return out;
}
function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const items = rows().filter(r => (layer === "all" || r.layer === layer) && (filter === "all" || r.state === filter) && (!q || (r.domain + r.name).toLowerCase().includes(q)));
  document.getElementById("list").innerHTML = items.map(r => `<li class="${r.state}"><b>${r.domain}</b><span class="tag">${label(r.state)}</span><div class="muted">${r.name}</div></li>`).join("") || `<li>Nothing in this view.</li>`;
  const map = MAPS[layer] || MAPS.all;
  document.getElementById("map").src = map[0];
  document.getElementById("mapcap").textContent = map[1];
  const taken = rows().filter(r => r.state === "taken");
  document.getElementById("alert").innerHTML = taken.length ? `<div class="banner"><b>${taken.length} open name${taken.length===1?"":"s"} now registered.</b><div>${taken.map(t => t.domain).join(", ")}</div><div class="muted">If you bought it, it still needs to be marked owned. If you did not, someone else got there first.</div></div>` : "";
}
function chip(parent, id, text, group) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = text;
  b.dataset.id = id;
  b.onclick = () => {
    if (group === "layer") layer = id; else filter = id;
    for (const el of parent.children) el.classList.toggle("on", el.dataset.id === id);
    render();
  };
  parent.appendChild(b);
  return b;
}
async function boot() {
  const [h, s] = await Promise.all([
    fetch("holdings.json", { cache: "no-store" }).then(r => r.json()),
    fetch("status.json", { cache: "no-store" }).then(r => r.json()).catch(() => ({ domains: {} }))
  ]);
  holdings = h;
  status = s || { domains: {} };
  document.getElementById("checked").textContent = status.checked_at
    ? "Last registry check " + status.checked_at + ". Runs about once a day."
    : "Registry check has not run yet. It runs about once a day.";
  const layers = document.getElementById("layers");
  const filters = document.getElementById("filters");
  [["all","All layers"],["peak","Peak"],["zones","Zones"],["states","States"],["capitals","Capitals"]].forEach(([id, text], i) => {
    const b = chip(layers, id, text, "layer");
    if (i === 0) b.classList.add("on");
  });
  [["all","Any standing"],["owned","On our list"],["open","Still open"],["taken","Registered"]].forEach(([id, text], i) => {
    const b = chip(filters, id, text, "filter");
    if (i === 0) b.classList.add("on");
  });
  document.getElementById("q").addEventListener("input", render);
  render();
}
boot();
</script>
</body>
</html>
