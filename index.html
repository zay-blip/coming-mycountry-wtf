<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Coming soon</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Georgia, "Times New Roman", serif;
      background:
        linear-gradient(180deg, rgba(10,14,28,.72), rgba(10,14,28,.88)),
        repeating-linear-gradient(
          180deg,
          #b22234 0 7.69%,
          #fff 7.69% 15.38%
        );
      color: #f5f7ff;
      text-align: center;
      padding: 2rem;
    }
    .card {
      max-width: 28rem;
      padding: 2.5rem 2rem;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 1.25rem;
      background: rgba(8,12,24,.78);
      backdrop-filter: blur(8px);
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    .flag {
      font-size: 2.5rem;
      line-height: 1;
      margin-bottom: .75rem;
    }
    h1 {
      font-size: clamp(1.8rem, 5vw, 2.4rem);
      font-weight: 700;
      letter-spacing: .04em;
      margin-bottom: .6rem;
    }
    p {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: .95rem;
      opacity: .82;
      line-height: 1.45;
    }
    .domain {
      margin-top: 1.25rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: .8rem;
      opacity: .55;
      letter-spacing: .02em;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="flag" aria-hidden="true">🇺🇸</div>
    <h1>Coming soon</h1>
    <p>Something’s cooking. Check back.</p>
    <div class="domain" id="host"></div>
  </main>
  <script>
    document.getElementById('host').textContent = location.hostname || '';
  </script>
</body>
</html>
